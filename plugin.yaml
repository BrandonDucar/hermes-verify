name: hermes-verify
version: 0.4.0
description: Configurable tool-risk flags, audit metadata and held unverified-prose labels; source-matching verification remains under review.
author: Brandon Ducar / DreamNet (Verity and Codex AI-assisted contributions)
license: Apache-2.0
homepage: https://github.com/BrandonDucar/hermes-verify
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.7"
tags: [verification, evidence, safety, guardrails]
provides_tools:
  - verify_claim
  - query_receipts
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
python_dependencies: []
# Held output requires the declared version floor. Resolve unknown host identity
# through supported upstream discovery, never by dropping the admission gate.
config_schema:
  blocking_mode:
    type: bool
    default: false
    label: Blocking mode
    description: "When on, flagged tool calls are blocked (pre_tool_call returns a block directive). When off (default), flagged calls are logged and allowed through."
# capabilities: intentionally omitted — hermes-verify requests NO privileged
# host surfaces (no tool override, no ctx.llm, no platform actions, no
# secrets). It only observes tool calls, logs to its own data dir, and
# fetches user-supplied URLs from the verify_claim tool.
